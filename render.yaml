services:
  # ── Flask web app (sender / receiver pages) ──
  - type: web
    name: p2p-share
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # ── Self-hosted WebTorrent tracker (WebRTC signaling) ──
  - type: web
    name: p2p-share-tracker
    runtime: node
    rootDir: tracker
    buildCommand: npm install
    startCommand: node tracker-server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
